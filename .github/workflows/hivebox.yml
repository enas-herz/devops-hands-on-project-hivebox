name: hivebox workflow

on: [push, pull_request]
permissions:
 contents: read
jobs:
  ci:

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
      - name: run pylint
        run: python -m pylint hivebox.py test_hivebox.py project.py
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: "Dockerfile" 
      - name: run pytest
        run: pytest              
      - name: build docker image
        run: docker build --tag hivebox:v0.1.0 .  
      - name: TEST /version 
        run: |
          docker run --detach -p 127.0.0.1:80:5000/tcp hivebox:v0.1.0  
          sleep 5
          curl --show-error --silent http://127.0.0.1:80/version | grep "v0.1.0"  
              
